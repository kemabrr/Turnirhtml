<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin - PUBG Turnuvasy</title>
    <link rel="stylesheet" href="/static/css/base.css?v=1.0.1">
    <link rel="stylesheet" href="/static/css/admin.css?v=1.0.1">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="bg-animation">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <div class="container main-content">
        <div class="admin-login-box">
            <div class="admin-icon"><i class="fas fa-lock"></i></div>
            <h1>Admin Panel</h1>
            <form id="admin-login-form" novalidate>
                <div class="form-group">
                    <label for="sifre">Parol</label>
                    <input type="password" id="sifre" placeholder="Paroly girizin" required minlength="6" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit" id="login-btn">
                    <span class="btn-text">GIR</span>
                </button>
            </form>
        </div>
    </div>

    
    <script src="/static/js/admin_login.js?v=1.0.1"></script>
</body>
</html>
