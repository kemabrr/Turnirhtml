<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Magazyn</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0a0a0f;color:#fff;padding:20px;max-width:900px;margin:0 auto}
        h1{color:#ff2d55;text-align:center;margin-bottom:30px;font-size:28px}
        .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
        .tab-btn{padding:12px 24px;border:none;border-radius:12px;background:#1a1a25;color:#a0a0b0;cursor:pointer;font-weight:700;transition:.3s}
        .tab-btn.active{background:linear-gradient(135deg,#ff2d55,#ff6b35);color:#fff}
        .tab-content{display:none}
        .tab-content.active{display:block;animation:fadeIn .3s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .card{background:#1a1a25;border:1px solid #2a2a3a;border-radius:16px;padding:20px;margin-bottom:20px}
        .card h3{color:#ff2d55;margin-bottom:15px;font-size:18px}
        .form-group{margin-bottom:15px}
        .form-group label{display:block;color:#a0a0b0;font-size:13px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
        .form-group input,.form-group textarea,.form-group select{width:100%;padding:12px 14px;border:1px solid #2a2a3a;border-radius:12px;background:#12121a;color:#fff;font-size:15px;outline:none;transition:.3s}
        .form-group input:focus,.form-group textarea:focus{border-color:#ff2d55}
        .form-group textarea{min-height:80px;resize:vertical}
        .btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff2d55,#ff6b35);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.3s}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px25px rgba(255,45,85,.4)}
        .btn-secondary{background:#2a2a3a;margin-top:10px}
        .btn-danger{background:#ff3b30}
        table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px}
        th,td{padding:12px;text-align:left;border-bottom:1px solid #2a2a3a}
        th{color:#ff2d55;font-size:12px;text-transform:uppercase;letter-spacing:1px}
        td{color:#a0a0b0}
        .status-pending{color:#ff9500}
        .status-completed{color:#34c759}
        .status-cancelled{color:#ff3b30}
        .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
        .badge-uc{background:rgba(255,45,85,.15);color:#ff2d55}
        .badge-akkaunt{background:rgba(52,199,89,.15);color:#34c759}
        .actions{display:flex;gap:8px}
        .actions button{padding:6px 12px;border:none;border-radius:8px;font-size:12px;cursor:pointer}
        .btn-ok{background:#34c759;color:#fff}
        .btn-no{background:#ff3b30;color:#fff}
        .empty{text-align:center;padding:40px;color:#6b6b7b}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#1a1a25;border:1px solid #2a2a3a;border-radius:12px;padding:14px 24px;font-weight:600;z-index:2000;opacity:0;transition:.4s}
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        @media(max-width:600px){.grid-2{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <h1>🛒 ADMIN MAGAZYN</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('uc', this)">💎 UC Paketler</button>
        <button class="tab-btn" onclick="switchTab('akkaunt', this)">👤 Akkauntlar</button>
        <button class="tab-btn" onclick="switchTab('sargyt', this)">📋 Sargytlar</button>
        <button class="tab-btn" onclick="switchTab('ayarlar', this)">⚙️ Sazlamalar</button>
    </div>

    <!-- UC PAKETLER -->
    <div id="tab-uc" class="tab-content active">
        <div class="card">
            <h3>➕ Taze UC Paket Gosh</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Ady (mysal: 60 UC)</label>
                    <input type="text" id="uc-ad" placeholder="60 UC">
                </div>
                <div class="form-group">
                    <label>UC Sany</label>
                    <input type="number" id="uc-sany" placeholder="60">
                </div>
                <div class="form-group">
                    <label>Bahasy (TMT)</label>
                    <input type="number" id="uc-bahasy" placeholder="5" step="0.01">
                </div>
                <div class="form-group">
                    <label>Siralama</label>
                    <input type="number" id="uc-siralama" placeholder="0">
                </div>
            </div>
            <div class="form-group">
                <label>Surat URL (hökmany dal)</label>
                <input type="text" id="uc-surat" placeholder="https://...">
            </div>
            <button class="btn" onclick="addUCPaket()">UC Paket Gosh</button>
        </div>

        <div class="card">
            <h3>📋 Bar UC Paketler</h3>
            <div id="uc-list"><div class="empty">Yuklenyar...</div></div>
        </div>
    </div>

    <!-- AKKAUNTLAR -->
    <div id="tab-akkaunt" class="tab-content">
        <div class="card">
            <h3>➕ Taze Akkaunt Gosh</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Ady</label>
                    <input type="text" id="ak-ad" placeholder="Level 50 - Ace">
                </div>
                <div class="form-group">
                    <label>Level</label>
                    <input type="number" id="ak-level" placeholder="50">
                </div>
                <div class="form-group">
                    <label>Rank</label>
                    <input type="text" id="ak-rank" placeholder="Ace">
                </div>
                <div class="form-group">
                    <label>Skin Sany</label>
                    <input type="number" id="ak-skin" placeholder="120">
                </div>
                <div class="form-group">
                    <label>Bahasy (TMT)</label>
                    <input type="number" id="ak-bahasy" placeholder="150" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label>Taryh / Beýany</label>
                <textarea id="ak-taryh" placeholder="Akkaunt hakda maglumat..."></textarea>
            </div>
            <div class="form-group">
                <label>Suratlar URL (JSON format: ["url1","url2"])</label>
                <textarea id="ak-suratlar" placeholder='["https://...","https://..."]'></textarea>
            </div>
            <button class="btn" onclick="addAkkaunt()">Akkaunt Gosh</button>
        </div>

        <div class="card">
            <h3>📋 Bar Akkauntlar</h3>
            <div id="akkaunt-list"><div class="empty">Akkaunt yok</div></div>
        </div>
    </div>

    <!-- SARGYTLAR -->
    <div id="tab-sargyt" class="tab-content">
        <div class="card">
            <h3>📋 Ahli Sargytlar</h3>
            <div id="sargyt-list"><div class="empty">Sargyt yok</div></div>
        </div>
    </div>

    <!-- SAZLAMALAR -->
    <div id="tab-ayarlar" class="tab-content">
        <div class="card">
            <h3>⚙️ Sebet Sazlamalary</h3>
            <div class="form-group">
                <label>Admin Telefon Belgisi (Sebetdäki "Jaň et / SMS" düwmeleri üçin)</label>
                <input type="text" id="admin-telefon" placeholder="+993 6X XXX XXX">
            </div>
            <button class="btn" onclick="saklaAyarlar()">Sazlamalary Sakla</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = 'https://web-production-413a9.up.railway.app';
        let adminToken = localStorage.getItem('admin_token') || '';

        function switchTab(tab, btn){
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-'+tab).classList.add('active');
            if(tab==='uc') loadUCPaketler();
            if(tab==='akkaunt') loadAkkauntlar();
            if(tab==='sargyt') loadSargytlar();
            if(tab==='ayarlar') loadAyarlar();
        }

        async function apiPost(url,body){
            const r=await fetch(API+url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+adminToken},body:JSON.stringify(body)});
            if(!r.ok){
                const text=await r.text();
                console.error('API ýalňyşlygy:',r.status,text);
                return {success:false,message:`Serwer ${r.status}: ${text.slice(0,100)}`};
            }
            return await r.json();
        }
        async function apiGet(url){
            const r=await fetch(API+url,{headers:{'Authorization':'Bearer '+adminToken}});
            if(!r.ok){
                const text=await r.text();
                console.error('API ýalňyşlygy:',r.status,text);
                return {success:false,message:`Serwer ${r.status}: ${text.slice(0,100)}`};
            }
            return await r.json();
        }

        function showToast(msg,type='success'){
            const t=document.getElementById('toast');
            t.textContent=msg;t.style.borderColor=type==='success'?'#34c759':'#ff3b30';
            t.style.color=type==='success'?'#34c759':'#ff3b30';
            t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);
        }

        // UC
        async function addUCPaket(){
            const data={
                ad:document.getElementById('uc-ad').value,
                uc_sany:parseInt(document.getElementById('uc-sany').value)||0,
                bahasy:parseFloat(document.getElementById('uc-bahasy').value)||0,
                siralama:parseInt(document.getElementById('uc-siralama').value)||0,
                surat:document.getElementById('uc-surat').value||null
            };
            if(!data.ad||!data.uc_sany||!data.bahasy){showToast('Ahli meydanlary dolduryn!','error');return;}
            const res=await apiPost('/api/admin/uc-paket-ekle',data);
            if(res&&res.success){showToast('UC paket goshuldy!');loadUCPaketler();}
            else showToast(res?.message||'Yalnyshlyk','error');
        }

        async function loadUCPaketler(){
            const res=await apiGet('/api/uc-paketler');
            const el=document.getElementById('uc-list');
            if(!res||!res.success||!res.data.length){el.innerHTML='<div class="empty">UC paket yok</div>';return;}
            el.innerHTML='<table><tr><th>ID</th><th>Ady</th><th>UC</th><th>Bahasy</th><th>Siralama</th><th></th></tr>'+
                res.data.map(p=>`<tr><td>${p.id}</td><td>${p.ad}</td><td>${p.uc_sany}</td><td>${p.bahasy} TMT</td><td>${p.siralama}</td><td class="actions"><button class="btn-ok" style="padding:6px 12px;border:none;border-radius:8px;cursor:pointer" onclick="uytgetUCBaha(${p.id},${p.bahasy})">Baha</button><button class="btn-danger" style="padding:4px 10px;border:none;border-radius:6px;cursor:pointer" onclick="silUCPaket(${p.id})">Poz</button></td></tr>`).join('')+'</table>';
        }

        async function uytgetUCBaha(id,eskiBaha){
            const taze=prompt('Taze baha (TMT):',eskiBaha);
            if(taze===null)return;
            const bahasy=parseFloat(taze);
            if(isNaN(bahasy)||bahasy<=0){showToast('Nadogry baha!','error');return;}
            const res=await apiPost('/api/admin/uc-paket-uytget/'+id,{bahasy});
            if(res&&res.success){showToast('Baha uytgedildi!');loadUCPaketler();}
            else showToast(res?.message||'Yalnyshlyk','error');
        }

        async function silUCPaket(id){
            if(!confirm('Pozmak isleyanizmi?'))return;
            const res=await apiPost('/api/admin/uc-paket-sil/'+id,{});
            if(res&&res.success){showToast('Pozuldy!');loadUCPaketler();}
            else showToast(res?.message||'Yalnyshlyk','error');
        }

        // Akkaunt
        async function addAkkaunt(){
            const data={
                ad:document.getElementById('ak-ad').value,
                level:parseInt(document.getElementById('ak-level').value)||1,
                rank:document.getElementById('ak-rank').value||null,
                skin_sany:parseInt(document.getElementById('ak-skin').value)||0,
                bahasy:parseFloat(document.getElementById('ak-bahasy').value)||0,
                taryh:document.getElementById('ak-taryh').value||null,
                suratlar:document.getElementById('ak-suratlar').value||null
            };
            if(!data.ad||!data.bahasy){showToast('Ad we bahasy hokman!','error');return;}
            const res=await apiPost('/api/admin/akkaunt-ekle',data);
            if(res&&res.success){showToast('Akkaunt goshuldy!');loadAkkauntlar();}
            else showToast(res?.message||'Yalnyshlyk','error');
        }

        async function loadAkkauntlar(){
            const res=await apiGet('/api/akkauntlar');
            const el=document.getElementById('akkaunt-list');
            if(!res||!res.success||!res.data.length){el.innerHTML='<div class="empty">Akkaunt yok</div>';return;}
            el.innerHTML='<table><tr><th>ID</th><th>Ady</th><th>Level</th><th>Rank</th><th>Bahasy</th><th></th></tr>'+
                res.data.map(a=>`<tr><td>${a.id}</td><td>${a.ad}</td><td>${a.level}</td><td>${a.rank||'-'}</td><td>${a.bahasy} TMT</td><td><button class="btn-danger" style="padding:4px 10px;border:none;border-radius:6px;cursor:pointer" onclick="silAkkaunt(${a.id})">Poz</button></td></tr>`).join('')+'</table>';
        }

        async function silAkkaunt(id){
            if(!confirm('Pozmak isleyanizmi?'))return;
            const res=await apiPost('/api/admin/akkaunt-sil/'+id,{});
            if(res&&res.success){showToast('Pozuldy!');loadAkkauntlar();}
            else showToast(res?.message||'Yalnyshlyk','error');
        }

        // Sargytlar
        async function loadSargytlar(){
            const res=await apiGet('/api/admin/sargytlar');
            const el=document.getElementById('sargyt-list');
            if(!res||!res.success||!res.data.length){el.innerHTML='<div class="empty">Sargyt yok</div>';return;}
            el.innerHTML='<table><tr><th>ID</th><th>Katylyjy</th><th>Product</th><th>Bahasy</th><th>Status</th><th></th></tr>'+
                res.data.map(s=>{
                    const stClass=s.status==='completed'?'status-completed':s.status==='cancelled'?'status-cancelled':'status-pending';
                    const badge=s.product_type==='uc'?'<span class="badge badge-uc">UC</span>':'<span class="badge badge-akkaunt">AKKAUNT</span>';
                    return `<tr><td>#${s.id}</td><td>${s.katilimci_ady}<br><small>${s.katilimci_ref}</small></td><td>${badge} ${s.product_ady}</td><td>${s.bahasy} TMT</td><td class="${stClass}">${s.status.toUpperCase()}</td><td class="actions">${s.status==='pending'?`<button class="btn-ok" onclick="tassyklaSargyt(${s.id})">Tassykla</button><button class="btn-no" onclick="yzynaSargyt(${s.id})">Yzyna</button>`:'<span>-</span>'}</td></tr>`;
                }).join('')+'</table>';
        }

        async function tassyklaSargyt(id){
            const res=await apiPost('/api/admin/sargyt-tassykla/'+id,{});
            if(res&&res.success){showToast('Tassyklandy!');loadSargytlar();}
            else showToast(res?.message||'Yalnyshlyk','error');
        }

        async function yzynaSargyt(id){
            if(!confirm('Sargydy yzyna chekmek isleyanizmi?'))return;
            const res=await apiPost('/api/admin/sargyt-yzyna/'+id,{});
            if(res&&res.success){showToast('Yzyna chekildi!');loadSargytlar();}
            else showToast(res?.message||'Yalnyshlyk','error');
        }

        // Sazlamalar
        async function loadAyarlar(){
            const res=await apiGet('/api/magazyn-ayarlar');
            if(res&&res.success){
                document.getElementById('admin-telefon').value=res.data.admin_telefon||'';
            }
        }

        async function saklaAyarlar(){
            const telefon=document.getElementById('admin-telefon').value.trim();
            const res=await apiPost('/api/admin/magazyn-ayar-sakla',{admin_telefon:telefon});
            if(res&&res.success){showToast('Sazlamalar saklandy!');}
            else showToast(res?.message||'Yalnyshlyk','error');
        }

        // Ilki yukle
        loadUCPaketler();
    </script>
</body>
</html>
