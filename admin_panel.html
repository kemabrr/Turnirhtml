<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel - PUBG Turnuvasy</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .turnir-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
        .turnir-admin-card { background: rgba(255, 255, 255, 0.02); border-radius: 16px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.3s; }
        .turnir-admin-card:hover { border-color: rgba(255, 45, 85, 0.2); }
        .turnir-admin-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .turnir-admin-header h4 { font-size: 16px; font-weight: 700; color: #e8e8e8; }
        .turnir-admin-header .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .turnir-admin-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .turnir-admin-info p { font-size: 12px; opacity: 0.7; color: #a0a0c0; }
        .turnir-admin-info p strong { color: #ff8c00; }
        .turnir-admin-actions { display: flex; gap: 10px; }
        .btn-edit { flex: 1; padding: 10px; background: rgba(0, 150, 255, 0.15); border: 1px solid rgba(0, 150, 255, 0.3); border-radius: 10px; color: #0096ff; font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .btn-edit:hover { background: rgba(0, 150, 255, 0.25); }
        .btn-delete-turnir { flex: 1; padding: 10px; background: rgba(255, 45, 85, 0.15); border: 1px solid rgba(255, 45, 85, 0.3); border-radius: 10px; color: #ff2d55; font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .btn-delete-turnir:hover { background: rgba(255, 45, 85, 0.25); }
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .admin-modal.active { display: flex; }
        .admin-modal-content { background: linear-gradient(135deg, #12121a, #0d0d15); border-radius: 24px; padding: 32px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255, 45, 85, 0.2); }
        .admin-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .admin-modal-header h3 { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #ff2d55; }
        .modal-close-btn { background: none; border: none; color: rgba(255, 255, 255, 0.5); font-size: 24px; cursor: pointer; }
        .loading-box { text-align: center; padding: 40px; }
        .loading-box i { font-size: 32px; color: #ff2d55; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <div class="container main-content">
        <header class="admin-header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1>Admin Panel</h1>
                <button type="button" class="admin-logout-btn" onclick="adminLogout()">Cykys</button>
            </div>
            <div class="admin-stats">
                <div class="stat-box"><span>Toplam</span><strong id="stat-toplam">0</strong></div>
                <div class="stat-box"><span>Toleg Eden</span><strong id="stat-odeme">0</strong></div>
                <div class="stat-box"><span>Onaylanan</span><strong id="stat-onay">0</strong></div>
            </div>
        </header>

        <div class="admin-tabs">
            <button class="admin-tab-btn active" onclick="showAdminTab('turnir', this)" type="button"><i class="fas fa-calendar-alt"></i> Turnirler</button>
            <button class="admin-tab-btn" onclick="showAdminTab('katilimci', this)" type="button"><i class="fas fa-users"></i> Katylymcylar</button>
            <button class="admin-tab-btn" onclick="showAdminTab('topar', this)" type="button"><i class="fas fa-trophy"></i> Toparlar</button>
        </div>

        <div id="tab-turnir" class="admin-tab-content active">
            <section class="admin-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
                    <h2>Turnirler</h2>
                    <button class="btn-submit" onclick="openTurnirModal()" type="button" style="width:auto; padding:12px 24px; font-size:12px;">
                        <i class="fas fa-plus"></i> TÄZE TURNIR
                    </button>
                </div>
                <div id="turnir-list-container">
                    <div class="loading-box"><i class="fas fa-spinner"></i><p>Yuklenyar...</p></div>
                </div>
            </section>
        </div>

        <div id="tab-katilimci" class="admin-tab-content">
            <section class="admin-section">
                <h2>Katylymcylar</h2>
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead><tr><th>Ref. Kod</th><th>Ad</th><th>PUBG ID</th><th>Telefon</th><th>Turnir</th><th>Toleg</th><th>Onay</th><th>Islem</th></tr></thead>
                        <tbody id="katilimci-tbody">
                            <tr><td colspan="8" style="text-align:center;">Yuklenyar...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <div id="tab-topar" class="admin-tab-content">
            <section class="admin-section">
                <h2>Toparlar</h2>
                <div class="teams-grid" id="teams-grid-container">
                    <p style="text-align:center; opacity:0.6; padding:40px 0;">Yuklenyar...</p>
                </div>
            </section>
        </div>
    </div>

    <div class="admin-modal" id="turnir-modal">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h3 id="modal-title">Täze Turnir</h3>
                <button class="modal-close-btn" onclick="closeTurnirModal()" type="button"><i class="fas fa-times"></i></button>
            </div>
            <form id="turnir-form" class="ayar-form" style="padding:0; border:none; background:none;">
                <input type="hidden" id="modal-turnir-id" value="">

                <div class="ayar-group">
                    <label>Turnir Ady</label>
                    <input type="text" id="turnir-ad" placeholder="Mysal: PUBG MOBILE SQUAD" required>
                </div>
                <div class="ayar-group">
                    <label>Senesi</label>
                    <input type="text" id="turnir-senesi" placeholder="Mysal: 25 Iýul 2026" required>
                </div>
                <div class="ayar-group">
                    <label>Wagty</label>
                    <input type="text" id="turnir-wagty" placeholder="Mysal: 20:00 (TM)" required>
                </div>
                <div class="ayar-group">
                    <label>Karta</label>
                    <input type="text" id="turnir-karta" placeholder="Mysal: Erangel" required>
                </div>
                <div class="ayar-group">
                    <label>Mode</label>
                    <select id="turnir-mode" style="width:100%; padding:14px 16px; background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.08); border-radius:12px; color:#e8e8e8; font-size:15px; font-family:'Rajdhani',sans-serif;">
                        <option value="squad">Squad (4 kişi)</option>
                        <option value="duo">Duo (2 kişi)</option>
                        <option value="solo">Solo (1 kişi)</option>
                    </select>
                </div>
                <div class="ayar-group">
                    <label>Gatnaşyk</label>
                    <input type="text" id="turnir-gatnasym" placeholder="Mysal: Squad (4 kişi)">
                </div>
                <div class="ayar-group">
                    <label>Toleg</label>
                    <input type="text" id="turnir-tolek" placeholder="Mysal: 5 Manat">
                </div>
                <div class="ayar-group">
                    <label>Toleg Usuly</label>
                    <input type="text" id="turnir-tolek-usuly" placeholder="Mysal: TMCell SMS">
                </div>
                <div class="ayar-group">
                    <label>Yer Sany</label>
                    <input type="number" id="turnir-yer-sany" value="100" min="1" max="10000">
                </div>
                <div class="ayar-group">
                    <label>1-nji Orun</label>
                    <input type="text" id="turnir-b1" placeholder="Mysal: 300 Manat|+ 🏆 Kubok">
                </div>
                <div class="ayar-group">
                    <label>2-nji Orun</label>
                    <input type="text" id="turnir-b2" placeholder="Mysal: 150 Manat">
                </div>
                <div class="ayar-group">
                    <label>3-nji Orun</label>
                    <input type="text" id="turnir-b3" placeholder="Mysal: 50 Manat">
                </div>
                <div class="ayar-group">
                    <label>Jemi Bayrak</label>
                    <input type="text" id="turnir-bjemi" placeholder="Mysal: 500 M">
                </div>
                <div class="ayar-group">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" id="turnir-tolekli" checked style="width:20px; height:20px; accent-color:#ff2d55;">
                        <span>Tölegli Turnir</span>
                    </label>
                    <small style="font-size:11px; opacity:0.6; display:block; margin-top:4px;">Tölegsiz turnirde ulanyjy gönümen tassyklanýar</small>
                </div>
                <div class="ayar-group">
                    <label>Status</label>
                    <select id="turnir-status" style="width:100%; padding:14px 16px; background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.08); border-radius:12px; color:#e8e8e8; font-size:15px; font-family:'Rajdhani',sans-serif;">
                        <option value="upcoming">Gelejek</option>
                        <option value="current">Häzirki</option>
                        <option value="past">Geçen</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit" id="modal-submit-btn" style="margin-top:10px;">
                    <span class="btn-text">SAKLA</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://web-production-413a9.up.railway.app'; // ÖZ BACKEND URL-iňiz bilen çalyň

        let cachedTurnirler = [];
        let cachedKatilimcilar = [];
        let cachedTakimlar = [];

        function getAdminToken() { return localStorage.getItem('pubg_admin_token'); }
        function removeAdminToken() { localStorage.removeItem('pubg_admin_token'); }

        function getAdminAuthHeaders() {
            const token = getAdminToken();
            return {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            };
        }

        async function apiGet(endpoint) {
            const res = await fetch(API_URL + endpoint, { headers: getAdminAuthHeaders() });
            return res.json();
        }

        async function apiPost(endpoint, body) {
            const res = await fetch(API_URL + endpoint, {
                method: 'POST',
                headers: getAdminAuthHeaders(),
                body: JSON.stringify(body)
            });
            return res.json();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getTurnirAd(turnirId) {
            if (!turnirId) return '-';
            const t = cachedTurnirler.find(x => x.id === turnirId);
            return t ? t.ad : '-';
        }

        async function loadAdminData() {
            try {
                const response = await fetch(API_URL + '/api/admin-panel', { 
                    headers: getAdminAuthHeaders() 
                });

                // DÜZELDI: 401/403 yalnyslygynda logout
                if (response.status === 401 || response.status === 403) {
                    alert('Admin sessiýaňyz gutardy ýa-da hukuklaryňyz ýok. Täzeden giriň.');
                    adminLogout();
                    return;
                }

                const result = await response.json();

                if (!result.success) {
                    if (result.message && (result.message.includes('Admin') || result.message.includes('token'))) {
                        adminLogout();
                        return;
                    }
                }
                const data = result.data;
                if (!data) return;

                // Stats
                const s = data.stats || {};
                document.getElementById('stat-toplam').textContent = s.toplam || 0;
                document.getElementById('stat-odeme').textContent = s.odeme_yapan || 0;
                document.getElementById('stat-onay').textContent = s.onaylanan || 0;

                // Cache
                cachedTurnirler = data.turnirler || [];
                cachedKatilimcilar = data.katilimcilar || [];
                cachedTakimlar = data.takimlar || [];

                renderTurnirler(cachedTurnirler);
                renderKatilimcilar(cachedKatilimcilar);
                renderTakimlar(cachedTakimlar);
            } catch (e) {
                console.error('Admin data yuklenmedi:', e);
            }
        }

        function renderTurnirler(turnirler) {
            const container = document.getElementById('turnir-list-container');
            if (!turnirler || !turnirler.length) {
                container.innerHTML = '<p style="text-align:center; opacity:0.6; padding:40px 0;">Häzirki wagtda turnir ýok.</p>';
                return;
            }
            container.innerHTML = '<div class="turnir-list">' + turnirler.map(t => `
                <div class="turnir-admin-card">
                    <div class="turnir-admin-header">
                        <h4>${escapeHtml(t.ad)}</h4>
                        <div style="display:flex; gap:6px;">
                            ${t.tolekli === 0 ? '<span class="status-badge" style="background:rgba(0,200,83,0.15); color:#00c853; border:1px solid rgba(0,200,83,0.3);">TÖLEGSIZ</span>' : ''}
                            <span class="status-badge status-${escapeHtml(t.status)}">${escapeHtml(t.status)}</span>
                        </div>
                    </div>
                    <div class="turnir-admin-info">
                        <p><strong>Sene:</strong> ${escapeHtml(t.senesi)}</p>
                        <p><strong>Wagt:</strong> ${escapeHtml(t.wagty)}</p>
                        <p><strong>Karta:</strong> ${escapeHtml(t.karta)}</p>
                        <p><strong>Mode:</strong> ${escapeHtml(t.mode)}</p>
                        <p><strong>Toleg:</strong> ${escapeHtml(t.tolek)}</p>
                        <p><strong>Yer:</strong> ${t.onaylanan || 0}/${t.yer_sany || 0}</p>
                    </div>
                    <div class="turnir-admin-actions">
                        <button class="btn-edit" onclick="editTurnir(${t.id})" type="button">
                            <i class="fas fa-edit"></i> Üýtget
                        </button>
                        <button class="btn-delete-turnir" onclick="deleteTurnir(${t.id}, '${escapeHtml(t.ad)}')" type="button">
                            <i class="fas fa-trash"></i> Poz
                        </button>
                    </div>
                </div>
            `).join('') + '</div>';
        }

        function renderKatilimcilar(katilimcilar) {
            const tbody = document.getElementById('katilimci-tbody');
            if (!katilimcilar || !katilimcilar.length) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Katylymcy ýok</td></tr>';
                return;
            }
            tbody.innerHTML = katilimcilar.map(k => `
                <tr>
                    <td><code>${escapeHtml(k.referans_kodu)}</code></td>
                    <td>${escapeHtml(k.ad)}</td>
                    <td>${escapeHtml(k.pubg_id) || '-'}</td>
                    <td>${escapeHtml(k.telefon)}</td>
                    <td>${escapeHtml(getTurnirAd(k.turnir_id))}</td>
                    <td>${k.odeme_durumu === 1 ? '<i class="fas fa-check-circle" style="color:#00c853"></i>' : '<i class="fas fa-times-circle" style="color:#ff2d55"></i>'}</td>
                    <td>
                        ${k.admin_onay === 0 ? 'Garasyl yar' : k.admin_onay === 1 ? 'Tassyklandy' : 'Ret edildi'}
                    </td>
                    <td>
                        ${k.odeme_durumu === 1 && k.admin_onay === 0 ? `
                            <button onclick="onayla('${escapeHtml(k.referans_kodu)}')" class="btn-approve" type="button">Onayla</button>
                            <button onclick="reddet('${escapeHtml(k.referans_kodu)}')" class="btn-reject" type="button">Reddet</button>
                        ` : ''}
                        <button onclick="poz('${escapeHtml(k.referans_kodu)}')" class="btn-delete" type="button">Poz</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderTakimlar(takimlar) {
            const grid = document.getElementById('teams-grid-container');
            if (!takimlar || !takimlar.length) {
                grid.innerHTML = '<p style="text-align:center; opacity:0.6; padding:40px 0;">Topar ýok.</p>';
                return;
            }
            grid.innerHTML = takimlar.map(t => {
                let uyeCount = 1;
                if (t.uye1_referans) uyeCount++;
                if (t.uye2_referans) uyeCount++;
                if (t.uye3_referans) uyeCount++;
                return `
                    <div class="team-admin-card">
                        <h4>${escapeHtml(t.takim_adi || 'Topar')}</h4>
                        <p>Kod: <code>${escapeHtml(t.takim_kodu)}</code></p>
                        <p>Lider: ${escapeHtml(t.lider_ady || '-')}</p>
                        <p>Agzalar: ${uyeCount}</p>
                    </div>
                `;
            }).join('');
        }

        function showAdminTab(tab, btn) {
            document.querySelectorAll('.admin-tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-tab-btn').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            if (btn) btn.classList.add('active');
        }

        function openTurnirModal() {
            document.getElementById('modal-title').textContent = 'Täze Turnir';
            document.getElementById('modal-turnir-id').value = '';
            document.getElementById('turnir-form').reset();
            document.getElementById('turnir-modal').classList.add('active');
        }

        function closeTurnirModal() {
            document.getElementById('turnir-modal').classList.remove('active');
        }

        function editTurnir(id) {
            apiGet('/api/turnir-detay/' + id).then(result => {
                if (result.success) {
                    const t = result.turnir;
                    document.getElementById('modal-title').textContent = 'Turnir Üýtget';
                    document.getElementById('modal-turnir-id').value = t.id;
                    document.getElementById('turnir-ad').value = t.ad || '';
                    document.getElementById('turnir-senesi').value = t.senesi || '';
                    document.getElementById('turnir-wagty').value = t.wagty || '';
                    document.getElementById('turnir-karta').value = t.karta || '';
                    document.getElementById('turnir-mode').value = t.mode || 'squad';
                    document.getElementById('turnir-gatnasym').value = t.gatnasym || '';
                    document.getElementById('turnir-tolek').value = t.tolek || '';
                    document.getElementById('turnir-tolek-usuly').value = t.tolek_usuly || '';
                    document.getElementById('turnir-yer-sany').value = t.yer_sany || 100;
                    document.getElementById('turnir-b1').value = t.bayrak_1 || '';
                    document.getElementById('turnir-b2').value = t.bayrak_2 || '';
                    document.getElementById('turnir-b3').value = t.bayrak_3 || '';
                    document.getElementById('turnir-bjemi').value = t.bayrak_jemi || '';
                    document.getElementById('turnir-status').value = t.status || 'upcoming';
                    document.getElementById('turnir-tolekli').checked = t.tolekli === 1;
                    document.getElementById('turnir-modal').classList.add('active');
                }
            }).catch(e => alert('Turnir maglumatlaryny almakda yalnyslyk!'));
        }

        async function deleteTurnir(id, ad) {
            if (!confirm('"' + ad + '" turnirini pozmak isleyarsinizmi?')) return;
            try {
                const result = await apiPost('/api/admin-turnir-sil', { turnir_id: id });
                if (result.success) await loadAdminData();
                else alert(result.message);
            } catch (error) { alert('Yalnyslyk: ' + error.message); }
        }

        document.getElementById('turnir-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const turnirId = document.getElementById('modal-turnir-id').value;
            const isEdit = turnirId !== '';

            const data = {
                ad: document.getElementById('turnir-ad').value,
                senesi: document.getElementById('turnir-senesi').value,
                wagty: document.getElementById('turnir-wagty').value,
                karta: document.getElementById('turnir-karta').value,
                mode: document.getElementById('turnir-mode').value,
                gatnasym: document.getElementById('turnir-gatnasym').value,
                tolek: document.getElementById('turnir-tolek').value,
                tolek_usuly: document.getElementById('turnir-tolek-usuly').value,
                yer_sany: parseInt(document.getElementById('turnir-yer-sany').value) || 100,
                bayrak_1: document.getElementById('turnir-b1').value,
                bayrak_2: document.getElementById('turnir-b2').value,
                bayrak_3: document.getElementById('turnir-b3').value,
                bayrak_jemi: document.getElementById('turnir-bjemi').value,
                status: document.getElementById('turnir-status').value,
                tolekli: document.getElementById('turnir-tolekli').checked
            };

            if (isEdit) data.turnir_id = parseInt(turnirId);
            const url = isEdit ? '/api/admin-turnir-guncelle' : '/api/admin-turnir-ekle';

            try {
                const result = await apiPost(url, data);
                if (result.success) { closeTurnirModal(); await loadAdminData(); }
                else alert(result.message);
            } catch (error) { alert('Yalnyslyk: ' + error.message); }
        });

        async function onayla(refCode) {
            if (!confirm('Tassyklamak isleyarsinizmi?')) return;
            try {
                const result = await apiPost('/api/admin-onayla', { referans_kodu: refCode });
                if (result.success) await loadAdminData(); else alert(result.message);
            } catch (error) { alert('Yalnyslyk: ' + error.message); }
        }

        async function reddet(refCode) {
            if (!confirm('Ret etmek isleyarsinizmi?')) return;
            try {
                const result = await apiPost('/api/admin-reddet', { referans_kodu: refCode });
                if (result.success) await loadAdminData(); else alert(result.message);
            } catch (error) { alert('Yalnyslyk: ' + error.message); }
        }

        async function poz(refCode) {
            if (!confirm('Katylyjy pozmak isleyarsinizmi? Bu hereket yzyna alynyp bilmez!')) return;
            try {
                const result = await apiPost('/api/admin-poz', { referans_kodu: refCode });
                if (result.success) await loadAdminData(); else alert(result.message);
            } catch (error) { alert('Yalnyslyk: ' + error.message); }
        }

        function adminLogout() {
            removeAdminToken();
            window.location.href = './admin_login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!getAdminToken()) {
                window.location.href = './admin_login.html';
                return;
            }
            loadAdminData();
        });
    </script>
</body>
</html>
