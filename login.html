<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giris - PUBG Turnir</title>
    <link rel="stylesheet" href="/static/css/base.css?v=1.0.1">
    <link rel="stylesheet" href="/static/css/auth.css?v=1.0.1">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>
<body>
    <div class="bg-animation">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="auth-page">
        <header class="auth-header">
            <a href="./index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Yza</a>
            <h1>GIRIS</h1>
            <p>Hasabyňyza girin</p>
        </header>

        <div class="auth-tabs">
            <a href="./login.html" class="auth-tab active">GIRIS</a>
            <a href="./kayit.html" class="auth-tab">REGISTRASYA</a>
        </div>

        <div class="auth-form-container">
            <form id="login-form" class="auth-form" novalidate>
                <div class="auth-input-group">
                    <label><i class="fas fa-mobile-alt"></i> Telefon Nomeri</label>
                    <input type="tel" id="telefon" placeholder="+993 XX XXX XXX" required maxlength="20" autocomplete="tel" pattern="[0-9+\s\-]{8,20}">
                </div>

                <div class="auth-input-group">
                    <label><i class="fas fa-key"></i> Parol</label>
                    <input type="password" id="parol" placeholder="Parolyňyz" required minlength="6" maxlength="100" autocomplete="current-password">
                </div>

                <button type="submit" class="auth-submit-btn" id="login-btn">
                    <span class="btn-text">GIR</span>
                </button>
            </form>

            <div class="auth-forgot">
                <a href="#">Paroly ýatdan çykardym?</a>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="bottom-nav-container">
            <a href="./index.html" class="bottom-nav-item">
                <i class="fas fa-home"></i>
                <span>Esasy</span>
            </a>
            <a href="./turnir.html" class="bottom-nav-item">
                <i class="fas fa-trophy"></i>
                <span>Turnir</span>
            </a>
            <a href="./magazyn.html" class="bottom-nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>Magazyn</span>
            </a>
            <a href="./menyu.html" class="bottom-nav-item">
                <i class="fas fa-bars"></i>
                <span>Menýu</span>
            </a>
        </div>
    </nav>

    
    <script src="/static/js/login.js?v=1.0.1"></script>
</body>
</html>
