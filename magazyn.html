<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAGAZYN - PUBG Turnir</title>
    <link rel="stylesheet" href="/static/css/base.css?v=1.0.1">
    <link rel="stylesheet" href="/static/css/magazyn.css?v=2.0.0">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="bg-animation">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="app-container">
        <!-- HEADER -->
        <header class="magazyn-header">
            <div class="logo-section">
                <div class="logo-icon"><i class="fas fa-cart-shopping"></i></div>
                <div class="logo-text">
                    <h1>MAGAZYN</h1>
                    <p>PUBG UC we Akkauntlar</p>
                </div>
            </div>
        </header>

        <!-- KATEGORIYA SAYLAYJY -->
        <div class="category-tabs">
            <button class="tab-btn active" data-tab="uc">
                <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M12 2 2 9l10 13L22 9 12 2zm0 2.5L19.2 9 12 18.5 4.8 9 12 4.5zM7.5 9h9L12 15.5 7.5 9z"/></svg></span>
                <span class="tab-text">UC PAKETLER</span>
            </button>
            <button class="tab-btn" data-tab="akkaunt">
                <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/></svg></span>
                <span class="tab-text">AKKAUNTLAR</span>
            </button>
        </div>

        <!-- UC PAKETLER TAB -->
        <div id="tab-uc" class="tab-content active">
            <div class="section-title">
                <div class="title-line"></div>
                <h2>UC PAKETLER</h2>
                <div class="title-line"></div>
            </div>
            <div class="uc-grid" id="uc-grid"></div>
        </div>

        <!-- AKKAUNTLAR TAB -->
        <div id="tab-akkaunt" class="tab-content">
            <div class="section-title">
                <div class="title-line"></div>
                <h2>SATLYK AKKAUNTLAR</h2>
                <div class="title-line"></div>
            </div>
            <div class="akkaunt-list" id="akkaunt-list"></div>
        </div>

        <!-- SATYN AL MODAL -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="magazyn-modal-box">
                <div class="modal-header">
                    <h3 id="modal-title">Sargyt</h3>
                    <button class="modal-close" id="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="product-info" id="modal-product-info"></div>
                    <div class="form-group">
                        <label>Oýun ID (UC üçin hökmany)</label>
                        <input type="text" id="input-pubg-id" placeholder="Oýun ID-ňizi giriziň...">
                    </div>
                    <div class="form-group">
                        <label>Telefon belgiňiz</label>
                        <input type="tel" id="input-telefon" placeholder="+993 6X XXX XXX">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" id="btn-cancel">Ýatyr</button>
                    <button class="btn-confirm" id="btn-confirm">Sargyt et</button>
                </div>
            </div>
        </div>

        <!-- TOAST -->
        <div class="toast" id="toast"></div>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <div class="bottom-nav-container">
                <a href="./index.html" class="bottom-nav-item">
                    <i class="fas fa-home"></i>
                    <span>Esasy</span>
                </a>
                <a href="./turnir.html" class="bottom-nav-item">
                    <i class="fas fa-trophy"></i>
                    <span>Turnir</span>
                </a>
                <a href="./magazyn.html" class="bottom-nav-item active">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Magazyn</span>
                </a>
                <a href="./sebet.html" class="bottom-nav-item">
                    <i class="fas fa-bag-shopping"></i>
                    <span>Sebet</span>
                </a>
                <a href="./menyu.html" class="bottom-nav-item">
                    <i class="fas fa-bars"></i>
                    <span>Menýu</span>
                </a>
            </div>
        </nav>
    </div>

    <script src="/static/js/magazyn.js?v=2.0.0"></script>
</body>
</html>
