<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - PUBG Turnuvasy</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .close-btn:hover { background: rgba(255, 45, 85, 0.2) !important; border-color: rgba(255, 45, 85, 0.4) !important; color: #ff2d55 !important; transform: rotate(90deg); }
        .team-code-display { text-align: center; padding: 20px; background: rgba(0, 0, 0, 0.2); border-radius: 14px; margin-top: 16px; }
        .team-code-label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #a0a0c0; margin-bottom: 12px; }
        .team-code-box { display: flex; align-items: center; gap: 12px; background: rgba(0, 0, 0, 0.4); padding: 16px 20px; border-radius: 12px; border: 1px solid rgba(255, 45, 85, 0.2); margin-bottom: 10px; }
        .team-code-box code { flex: 1; font-family: 'Orbitron', monospace; font-size: 20px; color: #ff2d55; letter-spacing: 3px; text-shadow: 0 0 15px rgba(255, 45, 85, 0.3); }
        .team-code-box button { background: rgba(255, 45, 85, 0.15); border: 1px solid rgba(255, 45, 85, 0.3); border-radius: 10px; padding: 10px 16px; color: #ff2d55; cursor: pointer; transition: all 0.3s; font-size: 16px; }
        .team-code-box button:hover { background: rgba(255, 45, 85, 0.25); box-shadow: 0 0 20px rgba(255, 45, 85, 0.2); }
        .team-code-hint { font-size: 12px; opacity: 0.6; color: #a0a0c0; }
        .logout-section { text-align: center; margin-top: 30px; padding: 24px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .logout-btn-pro { display: inline-flex; align-items: center; gap: 12px; background: linear-gradient(135deg, rgba(255, 45, 85, 0.1), rgba(255, 45, 85, 0.05)); border: 1.5px solid rgba(255, 45, 85, 0.3); border-radius: 16px; color: #ff2d55; padding: 16px 40px; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; width: 100%; max-width: 300px; justify-content: center; }
        .logout-btn-pro:hover { background: linear-gradient(135deg, rgba(255, 45, 85, 0.2), rgba(255, 45, 85, 0.1)); border-color: #ff2d55; box-shadow: 0 8px 30px rgba(255, 45, 85, 0.3); transform: translateY(-2px); }
        .logout-btn-pro i { font-size: 16px; }
        .loading { text-align: center; padding: 40px; opacity: 0.6; }
        .loading i { font-size: 32px; color: #ff2d55; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container main-content" style="padding-bottom: 80px;">
        <header class="form-header" style="position:relative;">
            <a href="./index.html" class="close-btn" style="position:absolute; top:20px; right:20px; width:36px; height:36px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:50%; color:#e8e8e8; font-size:18px; display:flex; align-items:center; justify-content:center; text-decoration:none; transition:all 0.3s; z-index:10;"><i class="fas fa-times"></i></a>
            <h1>PROFILIM</h1>
            <p>Katylma statusynyz</p>
        </header>

        <div id="profil-loading" class="loading">
            <i class="fas fa-spinner"></i>
            <p>Maglumatlar yuklenyar...</p>
        </div>

        <div id="profil-content" style="display:none;">
            <div class="profile-card">
                <div class="profile-avatar"><span><i class="fas fa-user"></i></span></div>
                <div class="profile-info">
                    <h2 id="profil-ad">-</h2>
                    <p class="profile-pubg-id" id="profil-telefon">-</p>
                    <p class="profile-ref" id="profil-ref">-</p>
                </div>
            </div>

            <div class="status-card">
                <h3>STATUSYM</h3>
                <div class="status-steps" id="status-steps">
                    <!-- JS bilen doldurylar -->
                </div>
                <div id="status-action"></div>
            </div>

            <div class="team-section">
                <h3>TOPARYM</h3>
                <div id="team-content">
                    <!-- JS bilen doldurylar -->
                </div>
            </div>

            <div class="logout-section">
                <button class="logout-btn-pro" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Hasapdan Çykyş</span>
                </button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="bottom-nav-container">
            <a href="./index.html" class="bottom-nav-item">
                <i class="fas fa-home"></i>
                <span>Esasy</span>
            </a>
            <a href="./turnir.html" class="bottom-nav-item">
                <i class="fas fa-trophy"></i>
                <span>Turnir</span>
            </a>
            <a href="./magazyn.html" class="bottom-nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>Magazyn</span>
            </a>
            <a href="./menyu.html" class="bottom-nav-item">
                <i class="fas fa-bars"></i>
                <span>Menýu</span>
            </a>
        </div>
    </nav>

    <script>
        const API_URL = 'https://web-production-413a9.up.railway.app'; // ÖZ BACKEND URL-iňiz bilen çalyň

        function getToken() { return localStorage.getItem('pubg_token'); }
        function removeToken() { localStorage.removeItem('pubg_token'); }

        function getAuthHeaders() {
            const token = getToken();
            return {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': 'Bearer ' + token } : {})
            };
        }

        async function apiGet(endpoint) {
            const res = await fetch(API_URL + endpoint, { headers: getAuthHeaders() });
            return res.json();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadProfil() {
            try {
                const result = await apiGet('/api/profil');
                if (!result.success || !result.data || !result.data.katilimci) {
                    window.location.href = './login.html';
                    return;
                }

                const k = result.data.katilimci;
                const arkadaslar = result.data.arkadaslar || [];

                document.getElementById('profil-ad').textContent = k.ad;
                document.getElementById('profil-telefon').textContent = '📞 ' + k.telefon;
                document.getElementById('profil-ref').textContent = k.referans_kodu;

                // Status steps
                let stepsHtml = '';

                // Step 1: Hasaba alyndy
                stepsHtml += `
                    <div class="status-step completed">
                        <div class="step-icon"><i class="fas fa-check-circle"></i></div>
                        <div class="step-info">
                            <span class="step-title">Hasaba Alyndy</span>
                            <span class="step-date">${k.kayit_tarihi ? new Date(k.kayit_tarihi).toLocaleString('tk-TM') : '-'}</span>
                        </div>
                    </div>
                `;

                // Step 2: Toleg
                stepsHtml += `
                    <div class="status-step ${k.odeme_durumu === 1 ? 'completed' : 'pending'}">
                        <div class="step-icon">${k.odeme_durumu === 1 ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-hourglass-half"></i>'}</div>
                        <div class="step-info">
                            <span class="step-title">Toleg</span>
                            <span class="step-date">${k.odeme_durumu === 1 ? 'Toleg edildi' : 'Toleg garasyl yar'}</span>
                        </div>
                    </div>
                `;

                // Step 3: Admin tassyklamasy
                const onayClass = k.admin_onay === 1 ? 'completed' : (k.admin_onay === 2 ? 'rejected' : 'pending');
                const onayIcon = k.admin_onay === 1 ? '<i class="fas fa-check-circle"></i>' : (k.admin_onay === 2 ? '<i class="fas fa-times-circle"></i>' : '<i class="fas fa-hourglass-half"></i>');
                const onayText = k.admin_onay === 1 ? 'Tassyklandy!' : (k.admin_onay === 2 ? 'Ret edildi' : 'Garasyl yar');
                stepsHtml += `
                    <div class="status-step ${onayClass}">
                        <div class="step-icon">${onayIcon}</div>
                        <div class="step-info">
                            <span class="step-title">Admin Tassyklamasy</span>
                            <span class="step-date">${onayText}</span>
                        </div>
                    </div>
                `;

                document.getElementById('status-steps').innerHTML = stepsHtml;

                // Status action
                let actionHtml = '';
                if (k.admin_onay === 1) {
                    actionHtml = '<div class="status-badge approved">Siz Ustunlikli Tassyklandynyz!</div>';
                } else if (k.admin_onay === 2) {
                    actionHtml = '<div class="status-badge rejected">Ret Edildi</div><a href="./odeme.html" class="btn-primary" style="margin-top:15px;">TOLEGE GAYTADAN GIT</a>';
                } else if (k.odeme_durumu === 0) {
                    actionHtml = '<a href="./odeme.html" class="btn-primary" style="margin-top:15px;">TOLEGE GIT</a>';
                }
                document.getElementById('status-action').innerHTML = actionHtml;

                // Team
                let teamHtml = '';
                if (k.takim_kodu) {
                    teamHtml = `
                        <div class="team-card">
                            <div class="team-header">
                                <h4>${escapeHtml(k.takim_adi || 'Toparym')}</h4>
                            </div>
                            <div class="team-code-display">
                                <p class="team-code-label">Topar Kodyňyz:</p>
                                <div class="team-code-box">
                                    <code>${escapeHtml(k.takim_kodu)}</code>
                                    <button onclick="copyTeamCode()" type="button"><i class="fas fa-copy"></i></button>
                                </div>
                                <p class="team-code-hint">Bu kody dostlaryňyza paýlaşyň</p>
                            </div>
                        </div>
                    `;
                } else {
                    teamHtml = `
                        <div class="team-empty">
                            <p><i class="fas fa-users" style="font-size:32px; color:#ff2d55; margin-bottom:12px; display:block;"></i>Size topar baglanmady.</p>
                            <a href="./takim.html" class="btn-primary">TOPARA GOSUL</a>
                        </div>
                    `;
                }
                document.getElementById('team-content').innerHTML = teamHtml;

                document.getElementById('profil-loading').style.display = 'none';
                document.getElementById('profil-content').style.display = 'block';

            } catch (error) {
                console.error('Profil yuklenmedi:', error);
                window.location.href = './login.html';
            }
        }

        function copyTeamCode() {
            const code = document.querySelector('.team-code-box code');
            if (!code) return;
            const text = code.textContent;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => alert('Topar kody nusga alyndy!'));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); alert('Topar kody nusga alyndy!'); } catch(e) { alert(text); }
                document.body.removeChild(ta);
            }
        }

        function logout() {
            if (!confirm('Hakykatdanam cykmak isleyarsinizmi?')) return;
            removeToken();
            window.location.href = './index.html';
        }

        document.addEventListener('DOMContentLoaded', loadProfil);
    </script>
</body>
</html>
