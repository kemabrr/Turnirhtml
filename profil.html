<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - PUBG Turnuvasy</title>
    <link rel="stylesheet" href="/static/css/base.css?v=1.0.1">
    <link rel="stylesheet" href="/static/css/profil.css?v=1.0.1">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>
<body>
    <div class="bg-animation">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container main-content">
        <header class="form-header">
            <a href="./index.html" class="close-btn"><i class="fas fa-times"></i></a>
            <h1>PROFILIM</h1>
            <p>Katylma statusynyz</p>
        </header>

        <div id="profil-loading" class="loading">
            <i class="fas fa-spinner"></i>
            <p>Maglumatlar yuklenyar...</p>
        </div>

        <div id="profil-content">
            <div class="profile-card">
                <div class="profile-avatar"><span><i class="fas fa-user"></i></span></div>
                <div class="profile-info">
                    <h2 id="profil-ad">-</h2>
                    <p class="profile-pubg-id" id="profil-telefon">-</p>
                    <p class="profile-ref" id="profil-ref">-</p>
                </div>
            </div>

            <div class="status-card">
                <h3>STATUSYM</h3>
                <div class="status-steps" id="status-steps">
                    <!-- JS bilen doldurylar -->
                </div>
                <div id="status-action"></div>
            </div>

            <div class="team-section">
                <h3>TOPARYM</h3>
                <div id="team-content">
                    <!-- JS bilen doldurylar -->
                </div>
            </div>

            <div class="logout-section">
                <button class="logout-btn-pro" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Hasapdan Çykyş</span>
                </button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="bottom-nav-container">
            <a href="./index.html" class="bottom-nav-item">
                <i class="fas fa-home"></i>
                <span>Esasy</span>
            </a>
            <a href="./turnir.html" class="bottom-nav-item">
                <i class="fas fa-trophy"></i>
                <span>Turnir</span>
            </a>
            <a href="./magazyn.html" class="bottom-nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>Magazyn</span>
            </a>
            <a href="./menyu.html" class="bottom-nav-item">
                <i class="fas fa-bars"></i>
                <span>Menýu</span>
            </a>
        </div>
    </nav>

    
    <script src="/static/js/profil.js?v=1.0.1"></script>
</body>
</html>
