<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnirler - PUBG Turnuvasy</title>
    <link rel="stylesheet" href="/static/css/base.css?v=1.0.1">
    <link rel="stylesheet" href="/static/css/turnir.css?v=1.0.1">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>
<body>
    <div class="bg-animation">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container main-content">
        <header class="form-header" style="padding: 20px 0 16px;">
            <h1 style="font-family: 'Orbitron', sans-serif; font-size: 22px; color: #ff2d55; letter-spacing: 3px;">TURNIRLER</h1>
            <p style="opacity:0.7; font-size:14px;">Gatnaşmak isleýän turniriňizi saýlaň</p>
        </header>

        <!-- Gatnasylan turnirlerim -->
        <div id="my-tournaments-section" style="display:none;">
            <div class="my-tournaments">
                <h2><i class="fas fa-check-circle"></i> Gatnaşylan Turnirlerim</h2>
                <div id="my-tournaments-list"></div>
            </div>
        </div>

        <div class="tournament-tabs">
            <button class="tournament-tab active" onclick="filterTournaments('all', this)" type="button">Hemme</button>
            <button class="tournament-tab" onclick="filterTournaments('upcoming', this)" type="button">Gelejek</button>
            <button class="tournament-tab" onclick="filterTournaments('current', this)" type="button">Häzirki</button>
            <button class="tournament-tab" onclick="filterTournaments('past', this)" type="button">Geçen</button>
        </div>

        <div class="mode-filter">
            <button class="mode-btn active" onclick="filterMode('all', this)" type="button"><i class="fas fa-th"></i> Hemme</button>
            <button class="mode-btn" onclick="filterMode('solo', this)" type="button"><i class="fas fa-user"></i> Solo</button>
            <button class="mode-btn" onclick="filterMode('duo', this)" type="button"><i class="fas fa-user-friends"></i> Duo</button>
            <button class="mode-btn" onclick="filterMode('squad', this)" type="button"><i class="fas fa-users"></i> Squad</button>
        </div>

        <div class="tournament-list" id="tournament-list">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <h3>Yuklenyar...</h3>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="bottom-nav-container">
            <a href="./index.html" class="bottom-nav-item">
                <i class="fas fa-home"></i>
                <span>Esasy</span>
            </a>
            <a href="./turnir.html" class="bottom-nav-item active">
                <i class="fas fa-trophy"></i>
                <span>Turnir</span>
            </a>
            <a href="./magazyn.html" class="bottom-nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>Magazyn</span>
            </a>
            <a href="./menyu.html" class="bottom-nav-item">
                <i class="fas fa-bars"></i>
                <span>Menýu</span>
            </a>
        </div>
    </nav>

    <script src="/static/js/turnir.js?v=1.0.1"></script>
</body>
</html>
